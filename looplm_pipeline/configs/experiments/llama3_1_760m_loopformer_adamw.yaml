experiment_name: llama3_1_760m_loopformer_adamw
output_dir: outputs/llama3_1_760m_loopformer_adamw
seed: 42

model_config: configs/models/llama3_1_760m_loopformer.yaml
data_sources_config: configs/data/sources.yaml
tokenize_config: configs/data/tokenize_llama3_1.yaml
fsdp_config: configs/train/fsdp.yaml
optim_config: configs/train/optimizers/adamw/llama3_1_760m_loopformer.yaml
schedule_config: configs/train/schedules/wsd/llama3_1_760m_mbs10.yaml

train:
  global_batch_size: 1280
  micro_batch_size: 5
  grad_accum_steps: 32
  num_workers: 8
  prefetch_factor: 4
  persistent_workers: true
  max_steps: 5798
  save_checkpoint_interval: 1000
  log_interval: 10
  validation_interval: 400
  validation_max_batches: 200
  validation_log_interval_seconds: 10
  loss:
    type: loopformer_self_distill
    max_model_loops: 4
    short_ce_weight: 0.1
    consistency_weight: 0.1
